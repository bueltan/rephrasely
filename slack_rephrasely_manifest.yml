display_information:
  name: Rephrasely
  description: Rephrasely helps you send clearer, more thoughtful Slack messages with AI.
  background_color: "#268bff"
  long_description: Rephrasely is an AI Slack assistant that helps teams rewrite, translate, and polish messages before sending them. Use the slash command to generate an editable suggestion, review the result, and send the final message as yourself.
features:
  bot_user:
    display_name: Rephrasely
    always_online: true
  slash_commands:
    - command: /rephrasely
      url: https://rephrasely.com.ar/slack/rephrasely
      description: Rewrite, translate, or polish a Slack message with AI
      usage_hint: "[message to improve]"
      should_escape: false
oauth_config:
  redirect_urls:
    - https://rephrasely.com.ar/slack/oauth/callback
  scopes:
    bot:
      - commands
      - chat:write
settings:
  interactivity:
    is_enabled: true
    request_url: https://rephrasely.com.ar/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
