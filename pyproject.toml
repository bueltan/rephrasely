[project]
name = "rephrasely"
version = "0.1.0"
description = "This is a Slack app that helps improve grammar, spelling, and translate messages."
authors = [
    {name = "Denis Gimenez",email = "denisbueltan@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask (>=3.1.0,<4.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "slack-sdk (>=3.35.0,<4.0.0)",
    "PyYAML (>=6.0,<7.0)",
    "flask-session (>=0.8.0,<0.9.0)",
    "redis (>=6.4.0,<7.0.0)",
    "blinker (>=1.9.0,<2.0.0)",
    "click (>=8.2.1,<9.0.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "Jinja2 (>=3.1.6,<4.0.0)",
    "MarkupSafe (>=3.0.2,<4.0.0)",
    "Werkzeug (>=3.1.3,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
gunicorn = "^23.0.0"
pytest = "^8.3.5"

[tool.pytest.ini_options]
testpaths = ["tests"]

